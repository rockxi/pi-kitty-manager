# pi-kitty dashboard: the backend listens only on loopback.
server {
    listen 80;
    server_name agents.rockxi.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://agents.rockxi.ru$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name agents.rockxi.ru;
    ssl_certificate /etc/letsencrypt/live/agents.rockxi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.rockxi.ru/privkey.pem;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_set_header Host agents.rockxi.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
